<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" width="940" height="200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="940" height="200" rx="14" fill="#0d1117"/>
<rect x="30" y="45" width="190" height="64" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="125.0" y="69" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Show room</text><text x="125.0" y="89" text-anchor="middle" fill="#8b949e" font-size="12">on entry, or on look</text>
<line x1="220" y1="77" x2="257" y2="77" stroke="#6e7681" stroke-width="2"/><polygon points="265,77 256,72 256,82" fill="#6e7681"/>
<rect x="265" y="45" width="190" height="64" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="360.0" y="69" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Build options</text><text x="360.0" y="89" text-anchor="middle" fill="#8b949e" font-size="12">exits, items, actions</text>
<line x1="455" y1="77" x2="492" y2="77" stroke="#6e7681" stroke-width="2"/><polygon points="500,77 491,72 491,82" fill="#6e7681"/>
<rect x="500" y="45" width="190" height="64" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="595.0" y="69" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Read input</text><text x="595.0" y="89" text-anchor="middle" fill="#8b949e" font-size="12">number or typed command</text>
<line x1="690" y1="77" x2="727" y2="77" stroke="#6e7681" stroke-width="2"/><polygon points="735,77 726,72 726,82" fill="#6e7681"/>
<rect x="735" y="45" width="190" height="64" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/><text x="830.0" y="69" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Run the action</text><text x="830.0" y="89" text-anchor="middle" fill="#8b949e" font-size="12">move, take, use, open</text>
<path d="M 830.0 109 V 155 H 360.0 V 118" fill="none" stroke="#6e7681" stroke-width="2" stroke-dasharray="5 4"/><polygon points="360.0,111 355.0,120 365.0,120" fill="#6e7681"/>
<text x="595.0" y="177" text-anchor="middle" fill="#8b949e" font-size="12">repeat until the player dies or wins</text>
